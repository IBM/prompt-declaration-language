name: 'Ollama Setup'
description: 'Composte action for Ollama set up in GH environment'
runs:
  using: 'composite'
  steps:
    - name: Remove unnecessary files
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    # Cache Ollama models.
    # The install script below installs Ollama as a systemd service that runs as
    # the `ollama` system user, which stores models under
    # /usr/share/ollama/.ollama/models. That path is outside $HOME and cannot be
    # restored by actions/cache (the runner user has no write access to
    # /usr/share), so the cache was always empty and the models were re-downloaded
    # on every run. Instead we run the Ollama server ourselves as the runner user
    # with OLLAMA_MODELS pointed at ~/.ollama/models (see the "Start Ollama server"
    # step) and cache that directory. Keeping everything owned by the runner user
    # avoids the cross-user permission/sandboxing issues that come with the
    # system-wide service.
    #
    # The cache key deliberately does NOT hash this file. The expected outputs
    # in tests/results/ are tied to the exact model weights, so busting the
    # model cache on every edit to this action would re-pull whatever
    # `granite4:micro` points at that day and invalidate all of them.
    - name: Cache Ollama models
      uses: actions/cache@v5
      with:
        path: ~/.ollama/models
        key: ollama-models-${{ runner.os }}-granite4-micro-mxbai-embed-large-v1
        restore-keys: |
          ollama-models-${{ runner.os }}-

      # Set up Ollama
    - name: Install Ollama
      shell: bash
      env:
        # Pinned: a new Ollama release can change the inference kernels, which
        # changes model output and invalidates every expected result. Bump this
        # deliberately, expecting to regenerate tests/results/ with it.
        OLLAMA_VERSION: '0.32.5'
      run: |
        curl -fsSL https://ollama.com/install.sh | sudo -E sh

    - name: Start Ollama server
      shell: bash
      run: |
        # The installer starts Ollama as the `ollama` system user, which stores
        # models under /usr/share/ollama/.ollama — a path that cannot be cached.
        # Stop that service and run our own server as the runner user with the
        # models directory under $HOME (populated by the cache restore above) so
        # that pulled models persist across runs.
        sudo systemctl stop ollama 2>/dev/null || true
        mkdir -p "$HOME/.ollama/models"
        # Export OLLAMA_MODELS for subsequent steps (the ollama CLI reads it too).
        echo "OLLAMA_MODELS=$HOME/.ollama/models" >> "$GITHUB_ENV"
        # Launch the server in the background; it keeps running across later steps.
        OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$HOME/ollama-serve.log" 2>&1 &

    - name: Wait for Ollama server
      shell: bash
      run: |
        max_attempts=30
        attempt=1
        sleep 15
        
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt of $max_attempts..."
          if time curl -i http://localhost:11434; then
            echo "✅ Ollama server is ready!"
            exit 0
          else
            echo "❌ Attempt $attempt failed"
            if [ $attempt -lt $max_attempts ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          fi
          attempt=$((attempt + 1))
        done

        echo "❌ Failed to connect to Ollama server after $max_attempts attempts"
        exit 1

    - name: Pull models in examples/
      shell: bash
      run: |
        models=("granite4:micro" "mxbai-embed-large")
        for model in "${models[@]}"; do
          if ! ollama list | awk 'NR>1 {print $1}' | grep -q "$model"; then
            echo "📥 Pulling model: $model"
            ollama pull "$model"
          else
            echo "✅ Model already available: $model"
          fi
        done
        echo ""
        echo "Available models:"
        ollama list

    - name: Check that all required models are available
      shell: bash
      run: |
        models=("mxbai-embed-large" "granite4:micro")
        missing=0
        for model in "${models[@]}"; do
          if ! ollama list | awk 'NR>1 {print $1}' | grep -q "$model"; then
            echo "❌ Model $model is missing!"
            missing=1
          fi
        done

        if [ "$missing" -eq 1 ]; then
          exit 1
        else
          echo "✅ All expected models are available."
        fi

    # Model output is reproducible on a given runner but differs between runner
    # CPU generations: llama.cpp picks its SIMD kernels from the CPU's feature
    # flags, and the resulting rounding differences flip the occasional token.
    # That is why tests/results/ holds several accepted variants per example.
    # Log the fingerprint so a mismatch can be attributed to the model, the
    # Ollama build, or the hardware.
    - name: Log inference fingerprint
      shell: bash
      run: |
        echo "ollama: $(ollama --version)"
        ollama list
        lscpu | grep -E "^Model name|^Vendor ID" || true
