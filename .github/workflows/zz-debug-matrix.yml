---
# TEMPORARY: enumerates the distinct CPU/output classes in the runner pool and
# records expected outputs for whichever class this run lands on.
# Delete before merging.
name: DEBUG matrix

on:
  push:
    branches:
      - claude/run-examples-action-fix-hc9cjn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cpu-classes:
    name: CPU class survey
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ollama
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.14'
          runner-os: ${{ runner.os }}
      - name: Fingerprint this runner
        shell: bash
        run: |
          f=pdl-live-react/src-tauri/tests/cli/model-input-string.pdl
          out=$(pdl "$f")
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CLASS md5=$(printf '%s' "$out" | md5sum | cut -d' ' -f1) cpu=$cpu"

  record:
    name: Execution tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-examples
        with:
          python-version: '3.14'
          runner-os: ${{ runner.os }}
          repository: ${{ github.repository }}
          head-ref: ${{ github.ref_name }}
          token: ${{ github.token }}
          update-results: 'true'
          check: '[]'
