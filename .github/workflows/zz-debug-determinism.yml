---
# TEMPORARY probe: is Ollama output reproducible (a) within one runner and
# (b) across runners? Delete before merging.
name: DEBUG determinism

on:
  push:
    branches:
      - claude/run-examples-action-fix-hc9cjn
  workflow_dispatch:

jobs:
  probe:
    name: Determinism probe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ollama
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.14'
          runner-os: ${{ runner.os }}
      - name: Environment fingerprint
        shell: bash
        run: |
          echo "=== CPU ==="
          lscpu | grep -E "^Model name|^Vendor ID|^CPU\(s\)|^Flags" | cut -c1-400
          echo "=== ollama ==="
          ollama --version
          ollama list
      - name: Same prompt, repeated on one machine
        shell: bash
        run: |
          f=pdl-live-react/src-tauri/tests/cli/model-input-string.pdl
          for i in 1 2 3; do
            out=$(pdl "$f")
            echo "--- attempt $i md5=$(printf '%s' "$out" | md5sum | cut -d' ' -f1)"
            printf '%s\n' "$out" | head -c 300
            echo
          done
          echo "=== after restarting the server (cold KV cache) ==="
          pkill -f "ollama serve" || true
          sleep 5
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$HOME/ollama-2.log" 2>&1 &
          until curl -sf http://localhost:11434 >/dev/null; do sleep 2; done
          out=$(pdl "$f")
          echo "--- cold md5=$(printf '%s' "$out" | md5sum | cut -d' ' -f1)"
          printf '%s\n' "$out" | head -c 300
